<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Desmos Clone</title>

    <meta name="title"       content="Desmos Clone">
    <meta name="description" content="A Desmos-style graphing calculator built with Raylib + WebAssembly">
    <meta name="keywords"    content="desmos, graphing calculator, raylib, webassembly, math, C++">

    <!-- Prevent pinch/double-tap zoom (conflicts with graph zoom); match device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- iOS: full-screen when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Open Graph -->
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="Desmos Clone">
    <meta property="og:description" content="A Desmos-style graphing calculator — pan, zoom, implicit curves">
    <meta property="og:url"         content="https://aavishkar331.github.io/Desmos-clone">

    <link rel="shortcut icon" href="logo.svg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;       /* no page scroll on mobile swipe */
            background: black;
            touch-action: none;     /* give all touch to canvas */
        }

        canvas.emscripten {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border: none;
            background: black;
            touch-action: none;
        }
    </style>

    <script type='text/javascript' src="https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js"> </script>
    <script type='text/javascript'>
        function saveFileFromMEMFSToDisk(memoryFSname, localFSname)
        {
            var isSafari = false;
            var data = FS.readFile(memoryFSname);
            var blob;
            if (isSafari) blob = new Blob([data.buffer], { type: "application/octet-stream" });
            else blob = new Blob([data.buffer], { type: "application/octet-binary" });
            saveAs(blob, localFSname);
        }
    </script>
  </head>
  <body>
    <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
    <p id="output" />
    <script>
        var Module = {
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.value = '';
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                      element.value += text + "\n";
                      element.scrollTop = element.scrollHeight;
                    }
                };
            })(),
            canvas: (function() {
                return document.getElementById('canvas');
            })()
        };
    </script>

    <!--
      Mobile keyboard bridge
      ──────────────────────
      iOS/Android only raise the soft keyboard if .focus() is called
      synchronously inside a touch handler. Our C++ game loop runs in
      requestAnimationFrame (not a touch context), so inp.focus() there
      is silently ignored by the browser.

      Fix: canvas touchstart listener calls inp.focus() HERE — in the
      touch handler — so the OS keyboard appears. C++ updates inp.value
      the next frame (~16ms), well before the keyboard animation ends.
    -->
    <script>
    (function () {
        window._desmosEqText    = '';
        window._desmosEqChanged = 0;

        // Must match C++ constants: PX=10, PX+PW=320, PY=10
        var PANEL_L = 10, PANEL_R = 320, PANEL_T = 10;

        function ensureInput() {
            var inp = document.getElementById('_desmos_eq_inp');
            if (!inp) {
                inp = document.createElement('input');
                inp.id = '_desmos_eq_inp';
                inp.type = 'text';
                inp.setAttribute('autocorrect',    'off');
                inp.setAttribute('autocapitalize', 'none');
                inp.setAttribute('spellcheck',     'false');
                // Offscreen but NOT display:none — iOS won't focus display:none elements
                inp.style.cssText =
                    'position:fixed;left:50px;top:-200px;' +
                    'width:242px;height:36px;opacity:0;' +
                    'pointer-events:none;z-index:9999;font-size:18px;';
                document.body.appendChild(inp);
                inp.addEventListener('input', function () {
                    window._desmosEqText    = inp.value;
                    window._desmosEqChanged = 1;
                });
            }
            return inp;
        }

        window.addEventListener('load', function () {
            ensureInput();
            var canvas = document.getElementById('canvas');
            if (!canvas) return;

            // touchstart is synchronous in gesture context → .focus() accepted by iOS/Android
            canvas.addEventListener('touchstart', function (e) {
                var t    = e.changedTouches[0];
                var rect = canvas.getBoundingClientRect();
                var x = t.clientX - rect.left;
                var y = t.clientY - rect.top;
                if (x >= PANEL_L && x <= PANEL_R && y >= PANEL_T) {
                    ensureInput().focus();
                }
            }, { passive: true });
        });
    })();
    </script>

    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
